name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.converters }} converters)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # pinned: the zigbee-herdsman-converters that zigbee2mqtt 2.14.3 ships.
        # latest: the newest release, so a zigbee2mqtt update that would break the overlays fails here first.
        converters: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Use the latest zigbee-herdsman-converters
        if: matrix.converters == 'latest'
        run: |
          herdsman="$(npm view zigbee-herdsman-converters@latest dependencies.zigbee-herdsman)"
          npm install --no-save --ignore-scripts zigbee-herdsman-converters@latest "zigbee-herdsman@${herdsman}"
      - name: Show versions
        # In the latest job the versions differ from the pins on purpose, which npm ls reports as invalid.
        run: npm ls zigbee-herdsman-converters zigbee-herdsman || true
      - name: Run tests
        run: npm test

  tools:
    name: Tools (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install requirements
        run: pip install -r tools/requirements.txt
      - name: Compile
        run: python -m py_compile tools/*.py
